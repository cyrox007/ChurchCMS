name: Проверка Nginx профиля

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'deploy/nginx/**'
      - '.github/workflows/nginx-profile-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'deploy/nginx/**'
      - '.github/workflows/nginx-profile-smoke.yml'

permissions:
  contents: read

jobs:
  nginx-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Nginx для проверки конфигурации
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nginx-light openssl

      - name: Подготовить тестовый TLS-сертификат
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/letsencrypt/live/churchcms.example
          sudo openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /etc/letsencrypt/live/churchcms.example/privkey.pem \
            -out /etc/letsencrypt/live/churchcms.example/fullchain.pem \
            -days 1 -subj '/CN=churchcms.example' >/dev/null 2>&1

      - name: Проверить синтаксис профиля
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo cp deploy/nginx/churchcms.conf.example /etc/nginx/conf.d/churchcms.conf
          sudo mkdir -p /var/www/churchcms/.well-known/acme-challenge
          printf 'acme-ok\n' | sudo tee /var/www/churchcms/.well-known/acme-challenge/probe >/dev/null
          sudo nginx -t

      - name: Проверить HTTP, HTTPS и защиту внутренних путей
        shell: bash
        run: |
          set -euo pipefail

          if pgrep -x nginx >/dev/null; then
            sudo nginx -s reload
          else
            sudo nginx
          fi

          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: churchcms.example' http://127.0.0.1/)"
          test "$code" = "301"

          body="$(curl -sS -H 'Host: churchcms.example' http://127.0.0.1/.well-known/acme-challenge/probe)"
          test "$body" = "acme-ok"

          for path in /config/app.php /storage/uploads/private.txt /.git/config /deploy/nginx/churchcms.conf.example; do
            code="$(curl -ksS -o /dev/null -w '%{http_code}' --resolve churchcms.example:443:127.0.0.1 "https://churchcms.example${path}")"
            test "$code" = "403"
          done

          code="$(curl -ksS -o /dev/null -w '%{http_code}' --resolve churchcms.example:443:127.0.0.1 https://churchcms.example/example.php)"
          test "$code" = "404"

          echo "Nginx production profile smoke OK"
