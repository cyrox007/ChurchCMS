name: Query-plan аудит

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'tools/performance/**'
      - '.github/workflows/query-plan-audit.yml'
      - 'modules/publications/**'
      - 'modules/comments/**'
      - 'database/migrations/**'
  push:
    branches:
      - develop
      - main
    paths:
      - 'tools/performance/**'
      - '.github/workflows/query-plan-audit.yml'
      - 'modules/publications/**'
      - 'modules/comments/**'
      - 'database/migrations/**'

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql
          coverage: none

      - name: Подготовить PostgreSQL benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => ['completed' => true],
              'security' => ['secret_key' => base64_encode(str_repeat('q', 32))],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP
          php bin/migrate.php
          php tools/performance/seed.php             --publications=10000             --comments=30000             --confirm=benchmark-fixture

      - name: Проверить PostgreSQL query plans
        run: php tools/performance/query-plan.php

  mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: churchcms
          MYSQL_USER: churchcms
          MYSQL_PASSWORD: churchcms
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Подготовить MySQL benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => ['completed' => true],
              'security' => ['secret_key' => base64_encode(str_repeat('m', 32))],
              'database' => [
                  'driver' => 'mysql',
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP
          php bin/migrate.php
          php tools/performance/seed.php             --publications=10000             --comments=30000             --confirm=benchmark-fixture

      - name: Проверить MySQL query plans
        run: php tools/performance/query-plan.php
