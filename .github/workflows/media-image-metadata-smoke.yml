name: Проверка технических размеров Media

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'modules/media/migrations/20260930_080000_add_media_image_metadata.php'
      - 'modules/media/MediaImageMetadata.php'
      - 'modules/media/MediaImageMetadataReader.php'
      - 'modules/media/MediaAsset.php'
      - 'modules/media/MediaRepository.php'
      - 'modules/media/MediaService.php'
      - 'modules/media/MediaUploadService.php'
      - 'modules/media/MediaApiResource.php'
      - 'modules/media/FederatedMediaFeedService.php'
      - 'modules/media/runtime.php'
      - 'themes/default/templates/admin/media/index.php'
      - 'tools/media-image-metadata-smoke.php'
      - '.github/workflows/media-image-metadata-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'modules/media/migrations/20260930_080000_add_media_image_metadata.php'
      - 'modules/media/MediaImageMetadata.php'
      - 'modules/media/MediaImageMetadataReader.php'
      - 'modules/media/MediaAsset.php'
      - 'modules/media/MediaRepository.php'
      - 'modules/media/MediaService.php'
      - 'modules/media/MediaUploadService.php'
      - 'modules/media/MediaApiResource.php'
      - 'modules/media/FederatedMediaFeedService.php'
      - 'modules/media/runtime.php'
      - 'themes/default/templates/admin/media/index.php'
      - 'tools/media-image-metadata-smoke.php'
      - '.github/workflows/media-image-metadata-smoke.yml'

permissions:
  contents: read

jobs:
  media-image-metadata:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, fileinfo, mbstring, openssl
          coverage: none

      - name: Проверить PHP
        run: |
          set -euo pipefail
          php -l modules/media/migrations/20260930_080000_add_media_image_metadata.php
          php -l modules/media/MediaImageMetadata.php
          php -l modules/media/MediaImageMetadataReader.php
          php -l modules/media/MediaAsset.php
          php -l modules/media/MediaRepository.php
          php -l modules/media/MediaService.php
          php -l modules/media/MediaUploadService.php
          php -l modules/media/MediaApiResource.php
          php -l modules/media/FederatedMediaFeedService.php
          php -l modules/media/runtime.php
          php -l themes/default/templates/admin/media/index.php
          php -l tools/media-image-metadata-smoke.php
          php bin/migrate.php validate
          php bin/theme-check.php

      - name: Подготовить тестовую установку
        run: |
          set -euo pipefail
          rm -rf /tmp/churchcms-media-image-metadata

          mkdir -p             storage/cache             storage/logs             storage/sessions             storage/rate-limits             storage/uploads

          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => ['completed' => true],
              'security' => [
                  'secret_key' => base64_encode(str_repeat('i', 32)),
              ],
              'media' => [
                  'storage_path' =>
                      '/tmp/churchcms-media-image-metadata',
                  'max_upload_bytes' => 1048576,
              ],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP

          php bin/migrate.php

      - name: Проверить размеры blob и безопасные projection
        run: php tools/media-image-metadata-smoke.php
