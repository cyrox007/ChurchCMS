name: Проверка связи Documents с Media

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'modules/media/MediaUsageRepository.php'
      - 'modules/media/MediaUsageService.php'
      - 'modules/media/MediaUsageCapability.php'
      - 'modules/documents/DocumentMediaService.php'
      - 'modules/documents/runtime.php'
      - 'tools/documents-media-file-link-smoke.php'
      - '.github/workflows/documents-media-file-link-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'modules/media/MediaUsageRepository.php'
      - 'modules/media/MediaUsageService.php'
      - 'modules/media/MediaUsageCapability.php'
      - 'modules/documents/DocumentMediaService.php'
      - 'modules/documents/runtime.php'
      - 'tools/documents-media-file-link-smoke.php'
      - '.github/workflows/documents-media-file-link-smoke.yml'

permissions:
  contents: read

jobs:
  documents-media-file-link:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, fileinfo, gd
          coverage: none

      - name: Проверить PHP
        run: |
          set -euo pipefail
          php -l modules/media/MediaUsageRepository.php
          php -l modules/media/MediaUsageService.php
          php -l modules/media/MediaUsageCapability.php
          php -l modules/documents/DocumentMediaService.php
          php -l modules/documents/runtime.php
          php -l tools/documents-media-file-link-smoke.php
          php bin/migrate.php validate

      - name: Подготовить тестовую установку
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          MEDIA_STORAGE="${RUNNER_TEMP}/churchcms-document-media"
          mkdir -p "${MEDIA_STORAGE}"

          cat > config/local.php <<PHP
          <?php

          declare(strict_types=1);

          return [
              'installation' => ['completed' => true],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
              'media' => [
                  'storage_path' => '${MEDIA_STORAGE}',
                  'max_upload_bytes' => 10485760,
              ],
          ];
          PHP

          php bin/migrate.php

      - name: Проверить прикрепление, detach и archive guard
        run: php tools/documents-media-file-link-smoke.php
