name: Проверка организационной структуры и федерации

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'core/SiteProfileCatalog.php'
      - 'config/app.php'
      - 'install.php'
      - 'modules/organizations/**'
      - 'modules/publications/PublicationRepository.php'
      - 'modules/events/**'
      - 'modules/publications/PublicationApiResource.php'
      - 'modules/publications/FederatedPublicationFeedService.php'
      - 'modules/organizations/FederationSyncWorker.php'
      - 'modules/organizations/FederationSyncCoordinator.php'
      - 'modules/publications/PublicationsCapability.php'
      - 'app/controllers/HealthController.php'
      - 'themes/default/templates/pages/home.php'
      - 'tools/federated-publication-theme-smoke.php'
      - 'modules/publications/FederatedPublicationSyndicationProvider.php'
      - 'core/SyndicationEntry.php'
      - 'core/Rss2SyndicationRenderer.php'
      - 'modules/publications/PublicationsApiController.php'
      - 'modules/publications/runtime.php'
      - 'bin/federation-sync.php'
      - 'themes/default/templates/admin/federation/**'
      - 'tools/organization-federation-smoke.php'
      - 'tools/federation-remote-projection-smoke.php'
      - 'tools/federation-publication-sync-smoke.php'
      - 'tools/federation-event-sync-smoke.php'
      - 'tools/federated-event-feed-smoke.php'
      - 'tools/federation-worship-sync-smoke.php'
      - 'tools/federated-worship-feed-smoke.php'
      - 'tools/federation-sync-coordinator-smoke.php'
      - 'tools/federation-worker-sync-state-smoke.php'
      - 'tools/federated-publication-feed-smoke.php'
      - '.github/workflows/organization-federation-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'core/SiteProfileCatalog.php'
      - 'config/app.php'
      - 'install.php'
      - 'modules/organizations/**'
      - 'modules/publications/PublicationRepository.php'
      - 'modules/events/**'
      - 'modules/publications/PublicationApiResource.php'
      - 'modules/publications/FederatedPublicationFeedService.php'
      - 'modules/organizations/FederationSyncWorker.php'
      - 'modules/organizations/FederationSyncCoordinator.php'
      - 'modules/publications/PublicationsCapability.php'
      - 'app/controllers/HealthController.php'
      - 'themes/default/templates/pages/home.php'
      - 'tools/federated-publication-theme-smoke.php'
      - 'modules/publications/FederatedPublicationSyndicationProvider.php'
      - 'core/SyndicationEntry.php'
      - 'core/Rss2SyndicationRenderer.php'
      - 'modules/publications/PublicationsApiController.php'
      - 'modules/publications/runtime.php'
      - 'bin/federation-sync.php'
      - 'themes/default/templates/admin/federation/**'
      - 'tools/organization-federation-smoke.php'
      - 'tools/federation-remote-projection-smoke.php'
      - 'tools/federation-publication-sync-smoke.php'
      - 'tools/federation-event-sync-smoke.php'
      - 'tools/federated-event-feed-smoke.php'
      - 'tools/federation-worship-sync-smoke.php'
      - 'tools/federated-worship-feed-smoke.php'
      - 'tools/federation-sync-coordinator-smoke.php'
      - 'tools/federation-worker-sync-state-smoke.php'
      - 'tools/federated-publication-feed-smoke.php'
      - '.github/workflows/organization-federation-smoke.yml'

permissions:
  contents: read

jobs:
  organization-federation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, openssl, mbstring, curl
          coverage: none

      - name: Проверить PHP и installer
        shell: bash
        run: |
          set -euo pipefail
          php -l core/SiteProfileCatalog.php
          php -l install.php
          find modules/organizations -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          php -l tools/organization-federation-smoke.php
          php -l tools/federation-remote-projection-smoke.php
          php -l tools/federation-publication-sync-smoke.php
          php -l tools/federation-event-sync-smoke.php
          php -l tools/federated-event-feed-smoke.php
          php -l modules/organizations/FederationEventSyncWorker.php
          php -l tools/federation-worship-sync-smoke.php
          php -l tools/federated-worship-feed-smoke.php
          php -l modules/organizations/FederationWorshipSyncWorker.php
          php -l tools/federation-sync-coordinator-smoke.php
          php -l tools/federation-worker-sync-state-smoke.php
          php -l modules/organizations/FederationSyncWorker.php
          php -l modules/organizations/FederationSyncCoordinator.php
          php -l tools/federated-publication-feed-smoke.php
          php -l modules/publications/PublicationRepository.php
          php -l modules/publications/FederatedPublicationFeedService.php
          php -l modules/publications/PublicationsCapability.php
          php -l app/controllers/HealthController.php
          php -l themes/default/templates/pages/home.php
          php -l tools/federated-publication-theme-smoke.php
          php -l modules/publications/FederatedPublicationSyndicationProvider.php
          php -l core/SyndicationEntry.php
          php -l core/Rss2SyndicationRenderer.php
          php -l modules/publications/PublicationsApiController.php
          php -l bin/federation-sync.php
          php -l themes/default/templates/admin/federation/index.php
          php bin/migrate.php validate

      - name: Подготовить тестовую установку
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => [
                  'completed' => true,
              ],
              'security' => [
                  'secret_key' => base64_encode(str_repeat('f', 32)),
              ],
              'site' => [
                  'name' => 'Тестовая епархия',
                  'profile' => 'diocese',
              ],
              'federation' => [
                  'enabled' => true,
                  'instance_id' => '50000000-0000-4000-8000-000000000005',
                  'allow_private_discovery' => true,
              ],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP
          php bin/migrate.php

      - name: Проверить локальное дерево и federation link
        run: php tools/organization-federation-smoke.php

      - name: Проверить remote projections и tombstones
        run: php tools/federation-remote-projection-smoke.php

      - name: Проверить federation sync публикаций и курсоры
        run: php tools/federation-publication-sync-smoke.php

      - name: Проверить federation sync событий
        run: php tools/federation-event-sync-smoke.php

      - name: Проверить federation sync богослужений
        run: php tools/federation-worship-sync-smoke.php

      - name: Проверить общий координатор federation sync
        run: php tools/federation-sync-coordinator-smoke.php

      - name: Проверить независимое состояние federation worker
        run: php tools/federation-worker-sync-state-smoke.php

      - name: Проверить агрегированную ленту публикаций
        run: php tools/federated-publication-feed-smoke.php

      - name: Проверить агрегированную ленту событий
        run: php tools/federated-event-feed-smoke.php

      - name: Проверить агрегированную ленту богослужений
        run: php tools/federated-worship-feed-smoke.php

      - name: Проверить публичный блок агрегированных публикаций
        run: php tools/federated-publication-theme-smoke.php

      - name: Проверить federation discovery endpoint
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 index.php >"$RUNNER_TEMP/federation-server.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          php -r '
          require "core.php";

          $raw = file_get_contents(
              "http://127.0.0.1:8099/api/v1/federation/meta"
          );
          if (!is_string($raw)) {
              fwrite(STDERR, "Federation meta endpoint недоступен.\n");
              exit(1);
          }

          $payload = json_decode(
              $raw,
              true,
              32,
              JSON_THROW_ON_ERROR,
          );
          $data = $payload["data"] ?? [];

          if (
              ($data["protocol"] ?? null)
                  !== "churchcms-federation-v1"
              || ($data["instance_id"] ?? null)
                  !== "50000000-0000-4000-8000-000000000005"
              || ($data["profile"] ?? null) !== "diocese"
              || ($data["organization"]["type"] ?? null)
                  !== "diocese"
              || ($data["organization"]["name"] ?? null)
                  !== "Тестовая епархия"
              || isset($data["token"])
              || isset($data["database_id"])
          ) {
              fwrite(
                  STDERR,
                  "Federation discovery раскрыл лишнее или потерял identity: "
                  . json_encode(
                      $payload,
                      JSON_UNESCAPED_UNICODE
                      | JSON_UNESCAPED_SLASHES,
                  )
                  . "\n",
              );
              exit(1);
          }

          $discovery = (new \ChurchCMS\Modules\Organizations\FederationDiscoveryClient())
              ->discover("http://127.0.0.1:8099");

          foreach ([
              "http://operator:secret@127.0.0.1:8099",
              "http://127.0.0.1:8099?token=secret",
              "http://127.0.0.1:8099#metadata",
          ] as $unsafeBaseUrl) {
              try {
                  (new \ChurchCMS\Modules\Organizations\FederationDiscoveryClient())
                      ->discover($unsafeBaseUrl);
                  fwrite(
                      STDERR,
                      "Federation discovery разрешил URL с userinfo/query/fragment.\n",
                  );
                  exit(1);
              } catch (\InvalidArgumentException) {
              }
          }

          if (
              ($discovery["instance_id"] ?? null)
                  !== "50000000-0000-4000-8000-000000000005"
              || ($discovery["organization"]["name"] ?? null)
                  !== "Тестовая епархия"
              || ($discovery["base_url"] ?? null)
                  !== "http://127.0.0.1:8099"
          ) {
              fwrite(STDERR, "Federation discovery client потерял identity.\n");
              exit(1);
          }

          $aggregatedRaw = file_get_contents(
              "http://127.0.0.1:8099/api/v1/publications/aggregated?limit=5"
          );
          if (!is_string($aggregatedRaw)) {
              fwrite(
                  STDERR,
                  "Endpoint агрегированной ленты публикаций недоступен.\n",
              );
              exit(1);
          }

          $aggregated = json_decode(
              $aggregatedRaw,
              true,
              32,
              JSON_THROW_ON_ERROR,
          );
          if (
              !is_array($aggregated["data"] ?? null)
              || !is_array(
                  $aggregated["meta"]["aggregation"] ?? null
              )
              || ($aggregated["meta"]["aggregation"]["limit"] ?? null)
                  !== 5
          ) {
              fwrite(
                  STDERR,
                  "Endpoint агрегированной ленты вернул неверный контракт.\n",
              );
              exit(1);
          }

          $entries = \ChurchCMS\App\Services\AdminNavigationRegistry::entries();
          $federationEntry = null;
          foreach ($entries as $entry) {
              if (($entry["id"] ?? null) === "federation") {
                  $federationEntry = $entry;
                  break;
              }
          }

          if (
              !is_array($federationEntry)
              || ($federationEntry["route"] ?? null)
                  !== "admin_federation"
              || ($federationEntry["permission"] ?? null)
                  !== "settings.manage"
          ) {
              fwrite(STDERR, "Federation wizard не зарегистрирован в Admin Shell.\n");
              exit(1);
          }

          $renderer = \ChurchCMS\Core\ThemeRenderer::fromConfig();
          $html = $renderer->capture(
              "admin.federation.index",
              [
                  "links" => \ChurchCMS\Modules\Organizations\FederationRepository::fromDatabase()->links(),
                  "organizations" => \ChurchCMS\Modules\Organizations\OrganizationRepository::fromDatabase()->tree(),
                  "preview" => $discovery,
                  "federationError" => null,
                  "federationForm" => [
                      "remote_base_url" => $discovery["base_url"],
                  ],
                  "federationStatus" => null,
              ],
          );

          foreach ([
              "Связи между самостоятельными сайтами",
              "name=\"remote_base_url\"",
              "name=\"local_organization_public_id\"",
              "Создать связь",
              "Проверить состояние",
              "Последний ответ discovery:",
              "Последняя синхронизация:",
              "Отозвать доверие",
          ] as $expected) {
              if (!str_contains($html, $expected)) {
                  fwrite(
                      STDERR,
                      "Federation wizard не содержит: {$expected}\n",
                  );
                  exit(1);
              }
          }

          echo "Federation discovery + pairing UI smoke OK\n";
          '
