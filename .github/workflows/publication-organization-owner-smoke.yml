name: Проверка владельца публикации

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'modules/publications/**'
      - 'modules/organizations/**'
      - 'tools/publication-organization-owner-smoke.php'
      - 'themes/default/templates/admin/publications/editor.php'
      - '.github/workflows/publication-organization-owner-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'modules/publications/**'
      - 'modules/organizations/**'
      - 'tools/publication-organization-owner-smoke.php'
      - 'themes/default/templates/admin/publications/editor.php'
      - '.github/workflows/publication-organization-owner-smoke.yml'

permissions:
  contents: read

jobs:
  publication-organization-owner:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, mbstring
          coverage: none

      - name: Проверить PHP и миграции
        run: |
          php -l modules/publications/Publication.php
          php -l modules/publications/PublicationRepository.php
          php -l modules/publications/PublicationService.php
          php -l modules/publications/PublicationOrganizationAccessService.php
          php -l modules/publications/PublicationsAdminController.php
          php -l modules/publications/PublicationApiResource.php
          php -l themes/default/templates/admin/publications/editor.php
          php -l modules/publications/migrations/20260927_120000_add_publication_organization_owner.php
          php -l tools/publication-organization-owner-smoke.php
          php bin/migrate.php validate
          php bin/theme-check.php

      - name: Подготовить тестовую установку
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => [
                  'completed' => true,
              ],
              'security' => [
                  'secret_key' => base64_encode(str_repeat('o', 32)),
              ],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP
          php bin/migrate.php

      - name: Проверить organization owner публикации
        run: php tools/publication-organization-owner-smoke.php
