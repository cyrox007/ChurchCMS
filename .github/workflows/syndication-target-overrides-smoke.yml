name: Проверка переопределений каналов синдикации

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'core/TargetAwareSyndicationProvider.php'
      - 'core/SyndicationRegistry.php'
      - 'core.php'
      - 'modules/publications/migrations/20261006_080000_create_publication_syndication_overrides.php'
      - 'modules/publications/PublicationSyndicationOverrideRepository.php'
      - 'modules/publications/PublicationSyndicationProvider.php'
      - 'modules/publications/PublicationSyndicationOverridesAdminController.php'
      - 'modules/publications/runtime.php'
      - 'themes/default/theme.json'
      - 'themes/default/templates/admin/publications/index.php'
      - 'themes/default/templates/admin/publications/syndication-overrides.php'
      - 'tools/syndication-target-overrides-smoke.php'
      - '.github/workflows/syndication-target-overrides-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'core/TargetAwareSyndicationProvider.php'
      - 'core/SyndicationRegistry.php'
      - 'core.php'
      - 'modules/publications/migrations/20261006_080000_create_publication_syndication_overrides.php'
      - 'modules/publications/PublicationSyndicationOverrideRepository.php'
      - 'modules/publications/PublicationSyndicationProvider.php'
      - 'modules/publications/PublicationSyndicationOverridesAdminController.php'
      - 'modules/publications/runtime.php'
      - 'themes/default/theme.json'
      - 'themes/default/templates/admin/publications/index.php'
      - 'themes/default/templates/admin/publications/syndication-overrides.php'
      - 'tools/syndication-target-overrides-smoke.php'
      - '.github/workflows/syndication-target-overrides-smoke.yml'

permissions:
  contents: read

jobs:
  target-overrides-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, dom, mbstring
          coverage: none
      - name: Проверить синтаксис и миграции
        run: |
          set -euo pipefail
          php -l core/TargetAwareSyndicationProvider.php
          php -l core/SyndicationRegistry.php
          php -l modules/publications/migrations/20261006_080000_create_publication_syndication_overrides.php
          php -l modules/publications/PublicationSyndicationOverrideRepository.php
          php -l modules/publications/PublicationSyndicationProvider.php
          php -l modules/publications/PublicationSyndicationOverridesAdminController.php
          php -l modules/publications/runtime.php
          php -l themes/default/templates/admin/publications/syndication-overrides.php
          php -l tools/syndication-target-overrides-smoke.php
          php bin/migrate.php validate
          php bin/theme-check.php
      - name: Подготовить PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          cat > config/local.php <<'PHP'
          <?php
          declare(strict_types=1);
          return [
              'installation' => ['completed' => true],
              'security' => ['secret_key' => base64_encode(str_repeat('t', 32))],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
              'syndication' => [
                  'enabled' => true,
                  'site_url' => 'https://example.test',
                  'targets' => [
                      'rss' => ['enabled' => true],
                      'rambler' => ['enabled' => true],
                  ],
              ],
          ];
          PHP
          php bin/migrate.php
      - name: Проверить переопределения каналов
        run: php tools/syndication-target-overrides-smoke.php

  target-overrides-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: churchcms
          MYSQL_USER: churchcms
          MYSQL_PASSWORD: churchcms
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, dom, mbstring
          coverage: none
      - name: Проверить синтаксис и миграции
        run: |
          set -euo pipefail
          php -l core/TargetAwareSyndicationProvider.php
          php -l core/SyndicationRegistry.php
          php -l modules/publications/migrations/20261006_080000_create_publication_syndication_overrides.php
          php -l modules/publications/PublicationSyndicationOverrideRepository.php
          php -l modules/publications/PublicationSyndicationProvider.php
          php -l modules/publications/PublicationSyndicationOverridesAdminController.php
          php -l modules/publications/runtime.php
          php -l themes/default/templates/admin/publications/syndication-overrides.php
          php -l tools/syndication-target-overrides-smoke.php
          php bin/migrate.php validate
          php bin/theme-check.php
      - name: Подготовить MySQL
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          cat > config/local.php <<'PHP'
          <?php
          declare(strict_types=1);
          return [
              'installation' => ['completed' => true],
              'security' => ['secret_key' => base64_encode(str_repeat('t', 32))],
              'database' => [
                  'driver' => 'mysql',
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
              'syndication' => [
                  'enabled' => true,
                  'site_url' => 'https://example.test',
                  'targets' => [
                      'rss' => ['enabled' => true],
                      'rambler' => ['enabled' => true],
                  ],
              ],
          ];
          PHP
          php bin/migrate.php
      - name: Проверить переопределения каналов
        run: php tools/syndication-target-overrides-smoke.php
