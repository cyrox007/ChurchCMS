name: Проверка сворачиваемой навигации Admin Shell

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'themes/default/templates/layouts/admin.php'
      - 'themes/default/assets/js/admin-shell.js'
      - 'themes/default/assets/css/site.css'
      - 'themes/default/theme.json'
      - '.github/workflows/admin-navigation-collapse-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'themes/default/templates/layouts/admin.php'
      - 'themes/default/assets/js/admin-shell.js'
      - 'themes/default/assets/css/site.css'
      - 'themes/default/theme.json'
      - '.github/workflows/admin-navigation-collapse-smoke.yml'

permissions:
  contents: read

jobs:
  admin-navigation:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Проверить PHP и тему
        shell: bash
        run: |
          set -euo pipefail
          php -l themes/default/templates/layouts/admin.php
          php bin/theme-check.php

      - name: Проверить JavaScript
        run: node --check themes/default/assets/js/admin-shell.js

      - name: Проверить контракт сворачивания
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-admin-frame' themes/default/templates/layouts/admin.php
          grep -q 'data-admin-sidebar-toggle' themes/default/templates/layouts/admin.php
          grep -q "asset('js/admin-shell.js')" themes/default/templates/layouts/admin.php
          grep -q 'churchcms.admin.sidebar.collapsed' themes/default/assets/js/admin-shell.js
          grep -q 'admin-frame--collapsed' themes/default/assets/js/admin-shell.js
          grep -q 'prefers-reduced-motion' themes/default/assets/css/site.css
          php -r '
          $theme = json_decode(file_get_contents("themes/default/theme.json"), true, 16, JSON_THROW_ON_ERROR);
          $version = (string) ($theme["version"] ?? "");
          if (preg_match("/^[0-9]+\\.[0-9]+\\.[0-9]+$/D", $version) !== 1) {
              fwrite(STDERR, "Версия темы имеет некорректный формат.\\n");
              exit(1);
          }
          '

      - name: Отрисовать layout с toggle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/sessions storage/cache storage/logs storage/rate-limits storage/uploads
          php -r '
          require "core.php";
          $renderer = \ChurchCMS\Core\ThemeRenderer::fromConfig();
          $html = $renderer->capture("layout.admin", [
              "title" => "Обзор",
              "siteName" => "Тестовый приход",
              "adminUser" => [
                  "display_name" => "Редактор",
                  "username" => "editor",
              ],
              "adminSection" => "overview",
              "adminNavigation" => [],
              "adminNavigationBadges" => [],
              "content" => "<p>collapse-smoke</p>",
          ]);

          foreach ([
              "data-admin-frame",
              "data-admin-sidebar-toggle",
              "aria-controls=\"admin-sidebar\"",
              "collapse-smoke",
              "admin-shell.js",
          ] as $expected) {
              if (!str_contains($html, $expected)) {
                  fwrite(STDERR, "Layout сворачивания не содержит: {$expected}\n");
                  exit(1);
              }
          }

          echo "Collapsible admin navigation smoke OK\n";
          '
