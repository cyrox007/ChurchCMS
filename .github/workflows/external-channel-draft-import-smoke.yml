name: Проверка импорта внешнего материала

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'core/HtmlSanitizer.php'
      - 'modules/publications/PublicationsCapability.php'
      - 'modules/publications/runtime.php'
      - 'modules/social/SocialAdminController.php'
      - 'modules/social/runtime.php'
      - 'themes/default/templates/admin/external-channels.php'
      - 'tools/external-channel-draft-import-smoke.php'
      - '.github/workflows/external-channel-draft-import-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'core/HtmlSanitizer.php'
      - 'modules/publications/PublicationsCapability.php'
      - 'modules/publications/runtime.php'
      - 'modules/social/SocialAdminController.php'
      - 'modules/social/runtime.php'
      - 'themes/default/templates/admin/external-channels.php'
      - 'tools/external-channel-draft-import-smoke.php'
      - '.github/workflows/external-channel-draft-import-smoke.yml'

permissions:
  contents: read

jobs:
  external-channel-draft-import:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, mbstring, dom, openssl
          coverage: none

      - name: Проверить PHP
        run: |
          set -euo pipefail
          php -l core/HtmlSanitizer.php
          php -l modules/publications/PublicationsCapability.php
          php -l modules/publications/runtime.php
          php -l modules/social/SocialAdminController.php
          php -l modules/social/runtime.php
          php -l themes/default/templates/admin/external-channels.php
          php -l tools/external-channel-draft-import-smoke.php
          php bin/migrate.php validate
          php bin/theme-check.php

      - name: Подготовить тестовую установку
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads

          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => ['completed' => true],
              'security' => [
                  'secret_key' => base64_encode(str_repeat('e', 32)),
              ],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP

          php bin/migrate.php

      - name: Проверить scoped импорт и обычный текст
        run: php tools/external-channel-draft-import-smoke.php
