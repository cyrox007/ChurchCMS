name: Проверка foundation документов

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'modules/documents/**'
      - 'modules/organizations/**'
      - 'tools/document-organization-smoke.php'
      - 'tools/document-partner-sync-smoke.php'
      - 'tools/federated-document-feed-smoke.php'
      - '.github/workflows/documents-organization-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'modules/documents/**'
      - 'modules/organizations/**'
      - 'tools/document-organization-smoke.php'
      - 'tools/document-partner-sync-smoke.php'
      - 'tools/federated-document-feed-smoke.php'
      - '.github/workflows/documents-organization-smoke.yml'

permissions:
  contents: read

jobs:
  documents-postgresql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, mbstring
          coverage: none

      - name: Проверить PHP и миграции
        shell: bash
        run: |
          set -euo pipefail
          find modules/documents -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tools/document-organization-smoke.php
          php -l tools/document-partner-sync-smoke.php
          php -l tools/federated-document-feed-smoke.php
          php bin/migrate.php validate

      - name: Подготовить тестовую установку
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => [
                  'completed' => true,
              ],
              'security' => [
                  'secret_key' => base64_encode(str_repeat('d', 32)),
              ],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP
          php bin/migrate.php

      - name: Проверить Documents и organization owner
        run: php tools/document-organization-smoke.php

      - name: Проверить source-side federation Documents
        run: php tools/document-partner-sync-smoke.php

      - name: Проверить агрегированную Documents-ленту
        run: php tools/federated-document-feed-smoke.php
