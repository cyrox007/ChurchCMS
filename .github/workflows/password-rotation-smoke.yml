name: Проверка ротации пароля администратора

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'database/migrations/20260927_080000_add_admin_auth_version.php'
      - 'app/services/AdminAuthService.php'
      - 'app/controllers/AdminAccountController.php'
      - 'app/middlewares/RequireAdminMiddleware.php'
      - 'config/routes.php'
      - 'themes/default/templates/admin/account-password.php'
      - 'themes/default/templates/layouts/admin.php'
      - 'themes/default/assets/css/site.css'
      - 'themes/default/theme.json'
      - '.github/workflows/password-rotation-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'database/migrations/20260927_080000_add_admin_auth_version.php'
      - 'app/services/AdminAuthService.php'
      - 'app/controllers/AdminAccountController.php'
      - 'app/middlewares/RequireAdminMiddleware.php'
      - 'config/routes.php'
      - 'themes/default/templates/admin/account-password.php'
      - 'themes/default/templates/layouts/admin.php'
      - 'themes/default/assets/css/site.css'
      - 'themes/default/theme.json'
      - '.github/workflows/password-rotation-smoke.yml'

permissions:
  contents: read

jobs:
  password-rotation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql
          coverage: none

      - name: Проверить PHP и тему
        shell: bash
        run: |
          set -euo pipefail
          php -l database/migrations/20260927_080000_add_admin_auth_version.php
          php -l app/services/AdminAuthService.php
          php -l app/controllers/AdminAccountController.php
          php -l app/middlewares/RequireAdminMiddleware.php
          php -l themes/default/templates/admin/account-password.php
          php bin/theme-check.php
          php bin/migrate.php validate

      - name: Подготовить тестовую установку
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => [
                  'completed' => true,
              ],
              'security' => [
                  'secret_key' => base64_encode(str_repeat('r', 32)),
              ],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP
          php bin/migrate.php

      - name: Проверить ротацию и отзыв старой сессии
        shell: bash
        run: |
          php -r '
          require "core.php";

          $pdo = \ChurchCMS\Core\DatabaseManager::getInstance()->connection();
          $now = gmdate("Y-m-d H:i:s");
          $oldPassword = "Old-password-12345";
          $newPassword = "New-password-67890";

          $insert = $pdo->prepare(
              "INSERT INTO admin_users (
                  public_id, username, password_hash, display_name, status,
                  created_at, updated_at
               ) VALUES (
                  :public_id, :username, :password_hash, :display_name, :status,
                  :created_at, :updated_at
               ) RETURNING id"
          );
          $insert->execute([
              "public_id" => "40000000-0000-4000-8000-000000000001",
              "username" => "rotation-smoke",
              "password_hash" => password_hash($oldPassword, PASSWORD_DEFAULT),
              "display_name" => "Проверка ротации",
              "status" => "active",
              "created_at" => $now,
              "updated_at" => $now,
          ]);
          $userId = (int) $insert->fetchColumn();

          $role = $pdo->prepare(
              "SELECT id FROM roles WHERE role_key = :role_key"
          );
          $role->execute(["role_key" => "superadmin"]);
          $roleId = (int) $role->fetchColumn();

          $assign = $pdo->prepare(
              "INSERT INTO admin_user_roles (user_id, role_id) VALUES (:user_id, :role_id)"
          );
          $assign->execute([
              "user_id" => $userId,
              "role_id" => $roleId,
          ]);

          $request = new \ChurchCMS\Core\Request();
          $auth = \ChurchCMS\App\Services\AdminAuthService::fromDatabase();

          $user = $auth->authenticate(
              $request,
              "rotation-smoke",
              $oldPassword,
          );

          if (
              !is_array($user)
              || (int) $request->session("admin_auth_version", 0) !== 1
          ) {
              fwrite(STDERR, "Начальная admin-сессия не создана.\n");
              exit(1);
          }

          try {
              $auth->rotatePassword(
                  $request,
                  "wrong-current-password",
                  $newPassword,
                  $newPassword,
              );
              fwrite(STDERR, "Смена пароля приняла неверный текущий пароль.\n");
              exit(1);
          } catch (InvalidArgumentException) {
          }

          $version = $auth->rotatePassword(
              $request,
              $oldPassword,
              $newPassword,
              $newPassword,
          );

          if (
              $version !== 2
              || (int) $request->session("admin_auth_version", 0) !== 2
              || $auth->current($request) === null
          ) {
              fwrite(STDERR, "Текущая сессия не обновлена после смены пароля.\n");
              exit(1);
          }

          $credentials = $pdo->prepare(
              "SELECT password_hash, auth_version FROM admin_users WHERE id = :id"
          );
          $credentials->execute(["id" => $userId]);
          $row = $credentials->fetch();

          if (
              !is_array($row)
              || (int) ($row["auth_version"] ?? 0) !== 2
              || !password_verify($newPassword, (string) $row["password_hash"])
              || password_verify($oldPassword, (string) $row["password_hash"])
          ) {
              fwrite(STDERR, "Новый пароль или auth_version не сохранены.\n");
              exit(1);
          }

          $request->setSession("admin_auth_version", 1);
          if ($auth->current($request) !== null) {
              fwrite(STDERR, "Старая auth_version не отозвала сессию.\n");
              exit(1);
          }

          $request->setSession("admin_auth_version", 2);
          if ($auth->current($request) === null) {
              fwrite(STDERR, "Актуальная auth_version ошибочно отклонена.\n");
              exit(1);
          }

          if (
              $auth->authenticate(
                  $request,
                  "rotation-smoke",
                  $oldPassword,
              ) !== null
          ) {
              fwrite(STDERR, "Старый пароль продолжает работать.\n");
              exit(1);
          }

          if (
              $auth->authenticate(
                  $request,
                  "rotation-smoke",
                  $newPassword,
              ) === null
          ) {
              fwrite(STDERR, "Новый пароль не работает.\n");
              exit(1);
          }

          echo "Password rotation/session revocation smoke OK\n";
          '

      - name: Проверить экран аккаунта
        shell: bash
        run: |
          php -r '
          require "core.php";
          $renderer = \ChurchCMS\Core\ThemeRenderer::fromConfig();

          $content = $renderer->capture("admin.account_password", [
              "passwordStatus" => null,
              "passwordError" => null,
          ]);

          foreach ([
              "current_password",
              "new_password",
              "new_password_confirm",
              "minlength=\"12\"",
              "/admin/account/password",
          ] as $expected) {
              if (!str_contains($content, $expected)) {
                  fwrite(STDERR, "Форма смены пароля не содержит: {$expected}\n");
                  exit(1);
              }
          }

          $layout = $renderer->capture("layout.admin", [
              "title" => "Смена пароля",
              "siteName" => "Тестовый приход",
              "adminUser" => [
                  "display_name" => "Проверка ротации",
                  "username" => "rotation-smoke",
              ],
              "adminSection" => "account",
              "adminNavigation" => [],
              "adminNavigationBadges" => [],
              "adminSearchQuery" => "",
              "adminTaskCount" => 0,
              "content" => $content,
          ]);

          if (
              !str_contains($layout, "/admin/account/password")
              || !str_contains($layout, "aria-current=\"page\"")
          ) {
              fwrite(STDERR, "Admin Shell не показывает ссылку активного аккаунта.\n");
              exit(1);
          }

          echo "Password rotation render smoke OK\n";
          '
