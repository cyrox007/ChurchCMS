name: Проверка видимости Media в Admin Shell

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'modules/media/MediaAdminController.php'
      - 'modules/media/runtime.php'
      - 'themes/default/templates/admin/media/index.php'
      - 'tools/media-visibility-admin-smoke.php'
      - '.github/workflows/media-visibility-admin-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'modules/media/MediaAdminController.php'
      - 'modules/media/runtime.php'
      - 'themes/default/templates/admin/media/index.php'
      - 'tools/media-visibility-admin-smoke.php'
      - '.github/workflows/media-visibility-admin-smoke.yml'

permissions:
  contents: read

jobs:
  media-visibility-admin:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql
          coverage: none

      - name: Проверить PHP
        run: |
          set -euo pipefail
          php -l modules/media/MediaAdminController.php
          php -l modules/media/runtime.php
          php -l themes/default/templates/admin/media/index.php
          php -l tools/media-visibility-admin-smoke.php
          php bin/migrate.php validate
          php bin/theme-check.php

      - name: Подготовить тестовую установку
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads

          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => ['completed' => true],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP

          php bin/migrate.php

      - name: Проверить UI, маршрут и federation state
        run: php tools/media-visibility-admin-smoke.php
