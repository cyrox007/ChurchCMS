name: Проверка MySQL runtime

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'core/MigrationRunner.php'
      - 'database/migrations/**'
      - 'modules/*/migrations/**'
      - 'modules/publications/PublicationService.php'
      - 'modules/publications/PublicationTaxonomyRepository.php'
      - 'modules/publications/PublicationTaxonomyService.php'
      - 'modules/publications/PublicationRepository.php'
      - 'modules/publications/PublicationPartnerTombstoneRepository.php'
      - 'modules/publications/PublicationApiResource.php'
      - 'modules/publications/FederatedPublicationFeedService.php'
      - 'modules/publications/PublicationsApiController.php'
      - 'modules/publications/runtime.php'
      - 'bin/federation-sync.php'
      - 'modules/pages/PageService.php'
      - 'modules/pages/PageRepository.php'
      - 'modules/organizations/**'
      - 'modules/people/**'
      - 'modules/worship/**'
      - 'modules/events/**'
      - 'modules/media/**'
      - 'modules/documents/**'
      - 'tools/publication-organization-owner-smoke.php'
      - 'tools/publication-partner-tombstone-smoke.php'
      - 'tools/people-organization-smoke.php'
      - 'tools/worship-organization-smoke.php'
      - 'tools/event-organization-smoke.php'
      - 'tools/media-organization-smoke.php'
      - 'tools/document-organization-smoke.php'
      - 'tools/federation-remote-projection-smoke.php'
      - 'tools/federation-publication-sync-smoke.php'
      - 'tools/federated-publication-feed-smoke.php'
      - 'tools/page-organization-owner-smoke.php'
      - '.github/workflows/mysql-runtime-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'core/MigrationRunner.php'
      - 'database/migrations/**'
      - 'modules/*/migrations/**'
      - 'modules/publications/PublicationService.php'
      - 'modules/publications/PublicationTaxonomyRepository.php'
      - 'modules/publications/PublicationTaxonomyService.php'
      - 'modules/publications/PublicationRepository.php'
      - 'modules/publications/PublicationPartnerTombstoneRepository.php'
      - 'modules/publications/PublicationApiResource.php'
      - 'modules/publications/FederatedPublicationFeedService.php'
      - 'modules/publications/PublicationsApiController.php'
      - 'modules/publications/runtime.php'
      - 'bin/federation-sync.php'
      - 'modules/pages/PageService.php'
      - 'modules/pages/PageRepository.php'
      - 'modules/organizations/**'
      - 'modules/people/**'
      - 'modules/worship/**'
      - 'modules/events/**'
      - 'modules/media/**'
      - 'modules/documents/**'
      - 'tools/people-organization-smoke.php'
      - 'tools/worship-organization-smoke.php'
      - 'tools/event-organization-smoke.php'
      - 'tools/media-organization-smoke.php'
      - 'tools/document-organization-smoke.php'
      - 'tools/federation-remote-projection-smoke.php'
      - 'tools/publication-organization-owner-smoke.php'
      - 'tools/publication-partner-tombstone-smoke.php'
      - 'tools/page-organization-owner-smoke.php'
      - '.github/workflows/mysql-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  mysql-runtime:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: churchcms
          MYSQL_USER: churchcms
          MYSQL_PASSWORD: churchcms
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Подготовить тестовую установку
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => [
                  'completed' => true,
              ],
              'security' => [
                  'secret_key' => base64_encode(str_repeat('y', 32)),
              ],
              'database' => [
                  'driver' => 'mysql',
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP

      - name: Применить миграции MySQL
        run: php bin/migrate.php

      - name: Проверить повторный запуск миграций
        shell: bash
        run: |
          set -euo pipefail
          output="$(php bin/migrate.php)"
          test "$output" = "No pending migrations."

      - name: Проверить MySQL runtime и полный набор миграций
        shell: bash
        run: |
          php -r '
          require "core.php";
          $database = \ChurchCMS\Core\DatabaseManager::getInstance();
          $pdo = $database->connection();

          if ((string) $pdo->getAttribute(PDO::ATTR_DRIVER_NAME) !== "mysql") {
              fwrite(STDERR, "Unexpected database driver.\n");
              exit(1);
          }

          $expected = (new \ChurchCMS\Core\MigrationRunner($database, CHURCHCMS_ROOT))->validate();
          $applied = $pdo->query(
              "SELECT migration_id FROM churchcms_migrations ORDER BY migration_id"
          )->fetchAll(PDO::FETCH_COLUMN);

          if ($applied !== $expected) {
              fwrite(
                  STDERR,
                  "Applied MySQL migrations do not match discovered migrations.\n"
                  . "expected=" . json_encode($expected, JSON_UNESCAPED_SLASHES) . "\n"
                  . "applied=" . json_encode($applied, JSON_UNESCAPED_SLASHES) . "\n",
              );
              exit(1);
          }

          $health = (new \ChurchCMS\Core\InstallationHealthCheck(
              $database,
              CHURCHCMS_ROOT,
          ))->check();

          if (($health["ready"] ?? false) !== true) {
              fwrite(
                  STDERR,
                  "MySQL runtime is not ready: "
                  . json_encode($health, JSON_UNESCAPED_SLASHES)
                  . "\n",
              );
              exit(1);
          }

          $service = \ChurchCMS\Modules\Publications\PublicationService::fromDatabase();
          $repository = \ChurchCMS\Modules\Publications\PublicationRepository::fromDatabase();
          $taxonomy = \ChurchCMS\Modules\Publications\PublicationTaxonomyService::fromDatabase();

          $firstPublicId = $service->createDraft(
              title: "MySQL taxonomy one",
              categoryNames: ["Общая категория", "Новости"],
              tagNames: ["проверка"],
          );
          $secondPublicId = $service->createDraft(
              title: "MySQL taxonomy two",
              categoryNames: ["Общая категория"],
          );
          $first = $repository->findByPublicId($firstPublicId);
          $second = $repository->findByPublicId($secondPublicId);

          if ($first === null || $second === null) {
              fwrite(STDERR, "MySQL taxonomy publications are missing.\n");
              exit(1);
          }

          $items = $taxonomy->forPublications([$first->id, $second->id]);
          $sharedStatement = $pdo->prepare(
              "SELECT COUNT(*) FROM publication_categories
               WHERE slug = :slug"
          );
          $sharedStatement->execute(["slug" => "obschaya-kategoriya"]);
          $shared = (int) $sharedStatement->fetchColumn();

          if (
              $shared !== 1
              || count($items[$first->id]["categories"] ?? []) !== 2
              || count($items[$second->id]["categories"] ?? []) !== 1
          ) {
              fwrite(STDERR, "MySQL taxonomy lifecycle failed.\n");
              exit(1);
          }

          echo "MySQL runtime smoke OK\n";
          '

      - name: Проверить tombstone partner-публикаций в MySQL
        run: php tools/publication-partner-tombstone-smoke.php

      - name: Проверить federation remote projections в MySQL
        run: php tools/federation-remote-projection-smoke.php

      - name: Проверить federation sync публикаций в MySQL
        run: php tools/federation-publication-sync-smoke.php

      - name: Проверить агрегированную ленту публикаций в MySQL
        run: php tools/federated-publication-feed-smoke.php

      - name: Проверить organization owner публикации в MySQL
        run: php tools/publication-organization-owner-smoke.php

      - name: Проверить organization owner страницы в MySQL
        run: php tools/page-organization-owner-smoke.php

      - name: Проверить людей и назначения в MySQL
        run: php tools/people-organization-smoke.php

      - name: Проверить расписание богослужений в MySQL
        run: php tools/worship-organization-smoke.php

      - name: Проверить события в MySQL
        run: php tools/event-organization-smoke.php

      - name: Проверить Media foundation в MySQL
        run: php tools/media-organization-smoke.php

      - name: Проверить Documents foundation в MySQL
        run: php tools/document-organization-smoke.php
