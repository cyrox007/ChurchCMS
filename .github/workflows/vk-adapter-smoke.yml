name: Проверка VK-адаптера

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'modules/social/ChannelHttpClient.php'
      - 'modules/social/NativeHttpClient.php'
      - 'modules/social/VkChannelAdapter.php'
      - 'modules/social/runtime.php'
      - 'tools/vk-adapter-smoke.php'
      - '.github/workflows/vk-adapter-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'modules/social/ChannelHttpClient.php'
      - 'modules/social/NativeHttpClient.php'
      - 'modules/social/VkChannelAdapter.php'
      - 'modules/social/runtime.php'
      - 'tools/vk-adapter-smoke.php'
      - '.github/workflows/vk-adapter-smoke.yml'

permissions:
  contents: read

jobs:
  vk-adapter:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl
          coverage: none

      - name: Проверить PHP
        run: |
          set -euo pipefail
          php -l modules/social/ChannelHttpClient.php
          php -l modules/social/NativeHttpClient.php
          php -l modules/social/VkChannelAdapter.php
          php -l modules/social/runtime.php
          php -l tools/vk-adapter-smoke.php
          php bin/migrate.php validate

      - name: Проверить VK без внешней сети
        run: php tools/vk-adapter-smoke.php
