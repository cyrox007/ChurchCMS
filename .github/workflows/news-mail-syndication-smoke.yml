name: Проверка контура Новости Mail

on:
  push:
    branches: [develop, main]
    paths:
      - 'core/NewsMailSyndicationRenderer.php'
      - 'core/NewsMailFeedValidator.php'
      - 'app/controllers/SyndicationController.php'
      - 'app/controllers/SyndicationAdminController.php'
      - 'modules/publications/PublicationSyndicationOverridesAdminController.php'
      - 'config/app.php'
      - 'config/routes.php'
      - 'themes/default/theme.json'
      - 'themes/default/templates/admin/news-mail-validator.php'
      - 'themes/default/templates/admin/syndication-exports.php'
      - 'themes/default/templates/admin/publications/syndication-overrides.php'
      - 'tools/news-mail-syndication-smoke.php'
      - 'docs/NEWS_MAIL_SYNDICATION.md'
      - '.github/workflows/news-mail-syndication-smoke.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'core/NewsMailSyndicationRenderer.php'
      - 'core/NewsMailFeedValidator.php'
      - 'app/controllers/SyndicationController.php'
      - 'app/controllers/SyndicationAdminController.php'
      - 'modules/publications/PublicationSyndicationOverridesAdminController.php'
      - 'config/app.php'
      - 'config/routes.php'
      - 'themes/default/theme.json'
      - 'themes/default/templates/admin/news-mail-validator.php'
      - 'themes/default/templates/admin/syndication-exports.php'
      - 'themes/default/templates/admin/publications/syndication-overrides.php'
      - 'tools/news-mail-syndication-smoke.php'
      - 'docs/NEWS_MAIL_SYNDICATION.md'
      - '.github/workflows/news-mail-syndication-smoke.yml'

permissions:
  contents: read

jobs:
  news-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring
          coverage: none
      - name: Проверить синтаксис и тему
        run: |
          set -euo pipefail
          php -l core/NewsMailSyndicationRenderer.php
          php -l core/NewsMailFeedValidator.php
          php -l app/controllers/SyndicationController.php
          php -l app/controllers/SyndicationAdminController.php
          php -l modules/publications/PublicationSyndicationOverridesAdminController.php
          php -l themes/default/templates/admin/news-mail-validator.php
          php -l themes/default/templates/admin/syndication-exports.php
          php -l themes/default/templates/admin/publications/syndication-overrides.php
          php -l tools/news-mail-syndication-smoke.php
          php bin/theme-check.php
      - name: Проверить технический фид Новости Mail
        run: php tools/news-mail-syndication-smoke.php
