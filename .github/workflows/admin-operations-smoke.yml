name: Проверка системных операций Admin Shell

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'core/BackupManager.php'
      - 'core/BackupRestoreOrchestrator.php'
      - 'core/DatabaseRestoreManager.php'
      - 'core/FileRestoreManager.php'
      - 'core/InstallationHealthCheck.php'
      - 'core/UpdatePackageStager.php'
      - 'core/UpdatePackageSignatureVerifier.php'
      - 'core/UpdateReleaseTransport.php'
      - 'core/UpdateReleaseDownloader.php'
      - 'tools/update-sign.php'
      - 'core/UpdatePackageApplier.php'
      - 'modules/operations/**'
      - 'themes/default/templates/admin/operations.php'
      - 'themes/default/assets/css/site.css'
      - 'themes/default/theme.json'
      - '.github/workflows/admin-operations-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'core/BackupManager.php'
      - 'core/BackupRestoreOrchestrator.php'
      - 'core/DatabaseRestoreManager.php'
      - 'core/FileRestoreManager.php'
      - 'core/InstallationHealthCheck.php'
      - 'core/UpdatePackageStager.php'
      - 'core/UpdatePackageSignatureVerifier.php'
      - 'core/UpdateReleaseTransport.php'
      - 'core/UpdateReleaseDownloader.php'
      - 'tools/update-sign.php'
      - 'core/UpdatePackageApplier.php'
      - 'modules/operations/**'
      - 'themes/default/templates/admin/operations.php'
      - 'themes/default/assets/css/site.css'
      - 'themes/default/theme.json'
      - '.github/workflows/admin-operations-smoke.yml'

permissions:
  contents: read

jobs:
  admin-operations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, openssl
          coverage: none

      - name: Проверить PHP и тему
        shell: bash
        run: |
          set -euo pipefail
          php -l core/BackupManager.php
          php -l core/BackupRestoreOrchestrator.php
          php -l core/DatabaseRestoreManager.php
          php -l core/FileRestoreManager.php
          php -l core/UpdatePackageStager.php
          php -l core/UpdatePackageSignatureVerifier.php
          php -l core/UpdateReleaseTransport.php
          php -l core/UpdateReleaseDownloader.php
          php -l tools/update-sign.php
          php -l modules/operations/OperationsService.php
          php -l modules/operations/OperationsAdminController.php
          php -l modules/operations/runtime.php
          php -l themes/default/templates/admin/operations.php
          php bin/theme-check.php

      - name: Подготовить тестовую установку
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          printf 'operations-smoke\n' > storage/uploads/operations-smoke.txt

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/update-private.pem"
          openssl pkey \
            -in "$RUNNER_TEMP/update-private.pem" \
            -pubout \
            -out "$RUNNER_TEMP/update-public.pem"

          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => [
                  'completed' => true,
              ],
              'security' => [
                  'secret_key' => base64_encode(str_repeat('o', 32)),
              ],
              'operations' => [
                  'backup_path' => getenv('RUNNER_TEMP') . '/operations-backups',
                  'update_staging_path' => getenv('RUNNER_TEMP') . '/operations-staging',
                  'update_trusted_public_keys' => [
                      'ci-release' => file_get_contents(
                          getenv('RUNNER_TEMP') . '/update-public.pem'
                      ),
                  ],
              ],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP
          php bin/migrate.php

      - name: Проверить backup и единое восстановление через OperationsService
        shell: bash
        run: |
          php -r '
          require "core.php";

          $organization = \ChurchCMS\Modules\Organizations\OrganizationService::fromDatabase()
              ->ensureSiteRoot(
                  "Состояние до резервной копии",
                  "parish",
                  "default",
              );

          $service = new \ChurchCMS\Modules\Operations\OperationsService();
          $created = $service->createBackup();
          $service->verifyBackup($created["id"]);

          $configHash = hash_file("sha256", "config/local.php");
          if (!is_string($configHash)) {
              fwrite(STDERR, "Не удалось вычислить SHA-256 config/local.php.\n");
              exit(1);
          }

          $pdo = \ChurchCMS\Core\DatabaseManager::getInstance()->connection();
          $statement = $pdo->prepare(
              "UPDATE organization_units "
              . "SET name = :name "
              . "WHERE public_id = :public_id"
          );
          $statement->execute([
              "name" => "Изменено после резервной копии",
              "public_id" => $organization->publicId,
          ]);

          file_put_contents(
              "config/local.php",
              "\n// изменено после резервной копии\n",
              FILE_APPEND,
          );
          file_put_contents(
              "storage/uploads/operations-smoke.txt",
              "изменено\n",
          );
          file_put_contents(
              "storage/uploads/extra-after-backup.txt",
              "лишний файл\n",
          );

          $restored = $service->restoreBackup($created["id"]);

          $nameStatement = $pdo->prepare(
              "SELECT name FROM organization_units "
              . "WHERE public_id = :public_id"
          );
          $nameStatement->execute([
              "public_id" => $organization->publicId,
          ]);
          $restoredName = $nameStatement->fetchColumn();

          $overview = $service->overview();
          $backupIds = array_column($overview["backups"], "id");

          if (
              ($overview["health"]["ready"] ?? false) !== true
              || !in_array($created["id"], $backupIds, true)
              || !in_array($restored["safety_backup_id"], $backupIds, true)
              || $restored["safety_backup_id"] === $created["id"]
              || ($restored["tables"] ?? 0) < 1
              || ($restored["files"] ?? 0) < 2
              || $restoredName !== "Состояние до резервной копии"
              || hash_file("sha256", "config/local.php") !== $configHash
              || trim((string) file_get_contents(
                  "storage/uploads/operations-smoke.txt"
              )) !== "operations-smoke"
              || file_exists("storage/uploads/extra-after-backup.txt")
          ) {
              fwrite(
                  STDERR,
                  "Единое восстановление через OperationsService выполнено некорректно: "
                  . json_encode(
                      [
                          "restore" => $restored,
                          "name" => $restoredName,
                          "backups" => $backupIds,
                      ],
                      JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES,
                  )
                  . "\n",
              );
              exit(1);
          }

          echo "Проверка резервного копирования и восстановления пройдена\n";
          '

      - name: Подготовить и проверить staging-пакет
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/operations-package"
          mkdir -p "$package/config"

          php -r '
          $source = file_get_contents("config/app.php");
          $updated = str_replace(
              "'\''version'\'' => '\''0.1.0-dev'\''",
              "'\''version'\'' => '\''999.2.0-ci'\''",
              (string) $source,
              $count,
          );
          if ($count !== 1) {
              fwrite(STDERR, "Не удалось подготовить тестовый config/app.php.\n");
              exit(1);
          }
          file_put_contents($argv[1] . "/config/app.php", $updated);
          ' "$package"

          php -r '
          $package = $argv[1];
          $file = $package . "/config/app.php";
          file_put_contents(
              $package . "/manifest.json",
              json_encode([
                  "format" => "churchcms-update-v1",
                  "from_version" => "0.1.0-dev",
                  "version" => "999.2.0-ci",
                  "php_min" => "8.3",
                  "files" => [[
                      "path" => "config/app.php",
                      "bytes" => filesize($file),
                      "sha256" => hash_file("sha256", $file),
                  ]],
                  "deleted_files" => [],
              ], JSON_THROW_ON_ERROR | JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL
          );
          ' "$package"

          php tools/update-sign.php \
            "$package/manifest.json" \
            "$RUNNER_TEMP/update-private.pem" \
            ci-release

          php -r '
          require "core.php";
          $stager = new \ChurchCMS\Core\UpdatePackageStager(
              CHURCHCMS_ROOT,
              (string) \ChurchCMS\Core\Config::get("operations.update_staging_path"),
          );
          $stage = $stager->stage($argv[1]);
          $overview = (new \ChurchCMS\Modules\Operations\OperationsService())->overview();
          $package = $overview["packages"][0] ?? null;

          if (
              ($package["id"] ?? null) !== $stage["id"]
              || ($package["version"] ?? null) !== "999.2.0-ci"
              || ($package["ready"] ?? false) !== true
              || ($package["code_only"] ?? false) !== true
              || ($package["signature_key_id"] ?? null)
                  !== "ci-release"
          ) {
              fwrite(
                  STDERR,
                  "OperationsService не показал готовый code-only пакет: "
                  . json_encode($overview["packages"], JSON_UNESCAPED_SLASHES)
                  . "\n",
              );
              exit(1);
          }

          file_put_contents(getenv("RUNNER_TEMP") . "/operations-stage-id", $stage["id"]);
          echo "Operations staging smoke OK\n";
          ' "$package"

      - name: Проверить модульную навигацию и экран
        shell: bash
        run: |
          php -r '
          require "core.php";

          $entries = \ChurchCMS\App\Services\AdminNavigationRegistry::entries();
          $operations = null;

          foreach ($entries as $entry) {
              if (($entry["id"] ?? null) === "operations") {
                  $operations = $entry;
                  break;
              }
          }

          if (
              !is_array($operations)
              || ($operations["route"] ?? null) !== "admin_operations"
              || ($operations["permission"] ?? null) !== "settings.manage"
          ) {
              fwrite(STDERR, "Модуль operations не зарегистрировал навигацию.\n");
              exit(1);
          }

          $overview = (new \ChurchCMS\Modules\Operations\OperationsService())->overview();
          $renderer = \ChurchCMS\Core\ThemeRenderer::fromConfig();
          $html = $renderer->capture("admin.operations", [
              "health" => $overview["health"],
              "backups" => $overview["backups"],
              "packages" => $overview["packages"],
              "releaseSourceConfigured" => true,
              "operationStatus" => null,
          ]);

          foreach ([
              "Резервные копии",
              "Подготовленные пакеты",
              "Подпись подтверждена ключом",
              "ci-release",
              "Создать копию",
              "confirm_restore",
              "Восстановить",
              "аварийный снимок",
              "confirm_stage",
              "Получить подписанный пакет",
              "/admin/system/backups/create",
              "/admin/system/backups/",
              "/admin/system/updates/",
          ] as $expected) {
              if (!str_contains($html, $expected)) {
                  fwrite(STDERR, "Экран системных операций не содержит: {$expected}\n");
                  exit(1);
              }
          }

          foreach ([
              "backup_path",
              "update_staging_path",
              "name=\"path\"",
              "Восстановление не запускается из браузера автоматически",
          ] as $forbidden) {
              if (str_contains($html, $forbidden)) {
                  fwrite(STDERR, "UI раскрывает технический путь: {$forbidden}\n");
                  exit(1);
              }
          }

          echo "Admin operations render smoke OK\n";
          '
