name: Проверка восстановления пароля администратора

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'app/controllers/AdminPasswordResetController.php'
      - 'app/middlewares/PasswordResetRateLimitMiddleware.php'
      - 'app/services/AdminPasswordResetService.php'
      - 'app/services/PasswordResetMessage.php'
      - 'app/services/PasswordResetTransport.php'
      - 'app/services/PasswordResetTransportFactory.php'
      - 'app/services/NativeMailPasswordResetTransport.php'
      - 'app/services/UnavailablePasswordResetTransport.php'
      - 'config/app.php'
      - 'config/routes.php'
      - 'database/migrations/20260930_120000_create_admin_password_resets.php'
      - 'themes/default/templates/auth/login.php'
      - 'themes/default/templates/auth/password-forgot.php'
      - 'themes/default/templates/auth/password-reset.php'
      - 'themes/default/theme.json'
      - 'tools/admin-password-reset-smoke.php'
      - '.github/workflows/admin-password-reset-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'app/controllers/AdminPasswordResetController.php'
      - 'app/middlewares/PasswordResetRateLimitMiddleware.php'
      - 'app/services/AdminPasswordResetService.php'
      - 'app/services/PasswordResetMessage.php'
      - 'app/services/PasswordResetTransport.php'
      - 'app/services/PasswordResetTransportFactory.php'
      - 'app/services/NativeMailPasswordResetTransport.php'
      - 'app/services/UnavailablePasswordResetTransport.php'
      - 'config/app.php'
      - 'config/routes.php'
      - 'database/migrations/20260930_120000_create_admin_password_resets.php'
      - 'themes/default/templates/auth/login.php'
      - 'themes/default/templates/auth/password-forgot.php'
      - 'themes/default/templates/auth/password-reset.php'
      - 'themes/default/theme.json'
      - 'tools/admin-password-reset-smoke.php'
      - '.github/workflows/admin-password-reset-smoke.yml'

permissions:
  contents: read

jobs:
  admin-password-reset:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql
          coverage: none

      - name: Проверить PHP
        run: |
          set -euo pipefail
          php -l app/controllers/AdminPasswordResetController.php
          php -l app/middlewares/PasswordResetRateLimitMiddleware.php
          php -l app/services/AdminPasswordResetService.php
          php -l app/services/PasswordResetMessage.php
          php -l app/services/PasswordResetTransport.php
          php -l app/services/PasswordResetTransportFactory.php
          php -l app/services/NativeMailPasswordResetTransport.php
          php -l app/services/UnavailablePasswordResetTransport.php
          php -l config/routes.php
          php -l database/migrations/20260930_120000_create_admin_password_resets.php
          php -l themes/default/templates/auth/login.php
          php -l themes/default/templates/auth/password-forgot.php
          php -l themes/default/templates/auth/password-reset.php
          php -l tools/admin-password-reset-smoke.php
          php bin/migrate.php validate
          php bin/theme-check.php

      - name: Подготовить тестовую установку
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads

          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => ['completed' => true],
              'app' => [
                  'url' => 'https://church.example',
              ],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP

          php bin/migrate.php

      - name: Проверить одноразовость и отзыв сессий
        run: php tools/admin-password-reset-smoke.php
