name: Проверка исходящих webhooks

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'core/AuditLog.php'
      - 'core/DistributionEventListener.php'
      - 'core/DistributionEventRegistry.php'
      - 'modules/distribution_webhooks/**'
      - 'themes/default/theme.json'
      - 'themes/default/templates/admin/distribution-webhooks.php'
      - 'bin/distribution-webhooks.php'
      - 'tools/distribution-webhooks-smoke.php'
      - '.github/workflows/distribution-webhooks-smoke.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'core/AuditLog.php'
      - 'core/DistributionEventListener.php'
      - 'core/DistributionEventRegistry.php'
      - 'modules/distribution_webhooks/**'
      - 'themes/default/theme.json'
      - 'themes/default/templates/admin/distribution-webhooks.php'
      - 'bin/distribution-webhooks.php'
      - 'tools/distribution-webhooks-smoke.php'
      - '.github/workflows/distribution-webhooks-smoke.yml'

permissions:
  contents: read

jobs:
  webhooks-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, dom, mbstring, curl, openssl
          coverage: none
      - name: Проверить синтаксис и миграции
        run: |
          set -euo pipefail
          php -l core/AuditLog.php
          find modules/distribution_webhooks -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/distribution-webhooks.php
          php -l tools/distribution-webhooks-smoke.php
          php -l themes/default/templates/admin/distribution-webhooks.php
          php bin/migrate.php validate
          php bin/theme-check.php
      - name: Подготовить PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          cat > config/local.php <<'PHP'
          <?php
          declare(strict_types=1);
          return [
              'installation' => ['completed' => true],
              'security' => ['secret_key' => base64_encode(str_repeat('w', 32))],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
              'syndication' => ['site_url' => 'https://example.test'],
          ];
          PHP
          php bin/migrate.php
      - name: Проверить lifecycle webhooks
        run: php tools/distribution-webhooks-smoke.php

  webhooks-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: churchcms
          MYSQL_USER: churchcms
          MYSQL_PASSWORD: churchcms
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, dom, mbstring, curl, openssl
          coverage: none
      - name: Проверить синтаксис и миграции
        run: |
          set -euo pipefail
          php -l core/AuditLog.php
          find modules/distribution_webhooks -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/distribution-webhooks.php
          php -l tools/distribution-webhooks-smoke.php
          php -l themes/default/templates/admin/distribution-webhooks.php
          php bin/migrate.php validate
          php bin/theme-check.php
      - name: Подготовить MySQL
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          cat > config/local.php <<'PHP'
          <?php
          declare(strict_types=1);
          return [
              'installation' => ['completed' => true],
              'security' => ['secret_key' => base64_encode(str_repeat('w', 32))],
              'database' => [
                  'driver' => 'mysql',
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
              'syndication' => ['site_url' => 'https://example.test'],
          ];
          PHP
          php bin/migrate.php
      - name: Проверить lifecycle webhooks
        run: php tools/distribution-webhooks-smoke.php
