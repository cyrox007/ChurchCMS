name: PHP 8.3 CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, pdo, pdo_pgsql
          coverage: none

      - name: Show PHP version
        run: php -v

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './legacy/*' -print0)

      - name: Bootstrap runtime
        run: php -r "require 'core.php'; echo 'ChurchCMS bootstrap OK', PHP_EOL;"

      - name: Validate migrations
        run: php bin/migrate.php validate

      - name: Smoke installation healthcheck
        shell: bash
        run: |
          php -r '
          require "core.php";
          $health = (new \ChurchCMS\Core\InstallationHealthCheck(
              \ChurchCMS\Core\DatabaseManager::getInstance(),
              CHURCHCMS_ROOT,
          ))->check();
          if (
              ($health["ready"] ?? null) !== false
              || ($health["checks"]["installation"] ?? null) !== false
              || ($health["checks"]["database"] ?? null) !== false
              || ($health["checks"]["migrations"] ?? null) !== true
          ) {
              fwrite(STDERR, "Unexpected fresh-checkout health state.\n");
              exit(1);
          }
          echo "Installation healthcheck smoke OK\n";
          '

      - name: Smoke generated output cache
        shell: bash
        run: |
          php -r '
          require "core.php";
          $cache = new \ChurchCMS\Core\GeneratedOutputCache(CHURCHCMS_ROOT . "/storage/cache/generated-smoke", 60);
          $key = $cache->key("ci", "fixture");
          $cache->put($key, "cached-output");
          if ($cache->get($key) !== "cached-output") {
              fwrite(STDERR, "Generated output cache miss after put.\n");
              exit(1);
          }
          \ChurchCMS\Core\PageCache::bumpVersion();
          if ($cache->key("ci", "fixture") === $key) {
              fwrite(STDERR, "Generated output cache key was not invalidated.\n");
              exit(1);
          }
          echo "Generated output cache smoke OK\n";
          '

      - name: Validate themes
        run: php bin/theme-check.php


  backup-smoke:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churchcms
          POSTGRES_USER: churchcms
          POSTGRES_PASSWORD: churchcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql
          coverage: none

      - name: Подготовить тестовую установку
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage/cache storage/logs storage/sessions storage/rate-limits storage/uploads
          printf 'backup-smoke\n' > storage/uploads/smoke.txt
          cat > config/local.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'installation' => [
                  'completed' => true,
              ],
              'security' => [
                  'secret_key' => base64_encode(str_repeat('b', 32)),
              ],
              'database' => [
                  'driver' => 'pgsql',
                  'host' => '127.0.0.1',
                  'port' => 5432,
                  'database' => 'churchcms',
                  'username' => 'churchcms',
                  'password' => 'churchcms',
              ],
          ];
          PHP
          php bin/migrate.php

      - name: Проверить runtime с реальной БД
        shell: bash
        run: |
          php -r '
          require "core.php";
          $database = \ChurchCMS\Core\DatabaseManager::getInstance();
          $pdo = $database->connection();

          if ((string) $pdo->getAttribute(PDO::ATTR_DRIVER_NAME) !== "pgsql") {
              fwrite(STDERR, "Unexpected database driver.\n");
              exit(1);
          }

          $health = (new \ChurchCMS\Core\InstallationHealthCheck(
              $database,
              CHURCHCMS_ROOT,
          ))->check();

          if (($health["ready"] ?? false) !== true) {
              fwrite(STDERR, "Installed runtime is not ready: " . json_encode($health, JSON_UNESCAPED_SLASHES) . "\n");
              exit(1);
          }

          $expected = (new \ChurchCMS\Core\MigrationRunner($database, CHURCHCMS_ROOT))->validate();
          $applied = $pdo->query("SELECT migration_id FROM churchcms_migrations ORDER BY migration_id")->fetchAll(PDO::FETCH_COLUMN);

          if ($applied !== $expected) {
              fwrite(STDERR, "Applied migrations do not match discovered migrations.\n");
              exit(1);
          }

          echo "Database-backed runtime smoke OK\n";
          '

      - name: Подготовить данные для проверки восстановления
        shell: bash
        run: |
          php -r '
          require "core.php";
          $publicId = \ChurchCMS\Modules\Publications\PublicationService::fromDatabase()
              ->createDraft("Материал до резервной копии");
          $pdo = \ChurchCMS\Core\DatabaseManager::getInstance()->connection();
          $statement = $pdo->prepare("SELECT id FROM publications WHERE public_id = :public_id");
          $statement->execute(["public_id" => $publicId]);
          $id = $statement->fetchColumn();

          if ($id === false) {
              fwrite(STDERR, "Не удалось подготовить тестовую публикацию.\n");
              exit(1);
          }

          file_put_contents(getenv("RUNNER_TEMP") . "/restore-public-id", $publicId);
          file_put_contents(getenv("RUNNER_TEMP") . "/restore-id", (string) $id);
          '

      - name: Создать и проверить резервную копию
        shell: bash
        run: |
          set -euo pipefail
          backup_root="$RUNNER_TEMP/churchcms-backups"
          php bin/backup.php create --path="$backup_root"
          manifest="$(find "$backup_root" -mindepth 2 -maxdepth 2 -name manifest.json -type f -print -quit)"
          test -n "$manifest"
          backup_id="$(basename "$(dirname "$manifest")")"
          printf '%s' "$backup_id" > "$RUNNER_TEMP/backup-id"
          php bin/backup.php verify "$backup_id" --path="$backup_root"
          sha256sum config/local.php > "$RUNNER_TEMP/config-local.sha256"
          sha256sum storage/uploads/smoke.txt > "$RUNNER_TEMP/upload-smoke.sha256"

      - name: Изменить данные после резервной копии
        shell: bash
        run: |
          php -r '
          require "core.php";
          $publicId = trim((string) file_get_contents(getenv("RUNNER_TEMP") . "/restore-public-id"));
          $pdo = \ChurchCMS\Core\DatabaseManager::getInstance()->connection();
          $statement = $pdo->prepare(
              "UPDATE publications SET title = :title, updated_at = :updated_at WHERE public_id = :public_id"
          );
          $statement->execute([
              "title" => "Изменено после резервной копии",
              "updated_at" => gmdate("Y-m-d H:i:s"),
              "public_id" => $publicId,
          ]);

          if ($statement->rowCount() !== 1) {
              fwrite(STDERR, "Не удалось изменить тестовую публикацию перед restore.\n");
              exit(1);
          }
          '

      - name: Изменить файлы после резервной копии
        shell: bash
        run: |
          set -euo pipefail
          printf '\n// изменено после резервной копии\n' >> config/local.php
          printf 'changed-after-backup\n' > storage/uploads/smoke.txt
          printf 'new-file\n' > storage/uploads/after-backup.txt

      - name: Восстановить данные БД
        shell: bash
        run: |
          set -euo pipefail
          backup_root="$RUNNER_TEMP/churchcms-backups"
          backup_id="$(cat "$RUNNER_TEMP/backup-id")"
          php bin/backup.php restore-db "$backup_id" --confirm="$backup_id" --path="$backup_root"

      - name: Проверить восстановленные данные и sequence
        shell: bash
        run: |
          php -r '
          require "core.php";
          $publicId = trim((string) file_get_contents(getenv("RUNNER_TEMP") . "/restore-public-id"));
          $originalId = (int) trim((string) file_get_contents(getenv("RUNNER_TEMP") . "/restore-id"));
          $pdo = \ChurchCMS\Core\DatabaseManager::getInstance()->connection();

          $statement = $pdo->prepare("SELECT id, title FROM publications WHERE public_id = :public_id");
          $statement->execute(["public_id" => $publicId]);
          $publication = $statement->fetch();

          if (
              !is_array($publication)
              || (int) ($publication["id"] ?? 0) !== $originalId
              || ($publication["title"] ?? null) !== "Материал до резервной копии"
          ) {
              fwrite(STDERR, "Данные публикации не восстановлены.\n");
              exit(1);
          }

          $nextPublicId = \ChurchCMS\Modules\Publications\PublicationService::fromDatabase()
              ->createDraft("Материал после восстановления");
          $statement = $pdo->prepare("SELECT id FROM publications WHERE public_id = :public_id");
          $statement->execute(["public_id" => $nextPublicId]);
          $nextId = (int) $statement->fetchColumn();

          if ($nextId <= $originalId) {
              fwrite(STDERR, "PostgreSQL sequence не синхронизирована после восстановления.\n");
              exit(1);
          }

          echo "Восстановление БД и sequence проверено\n";
          '

      - name: Восстановить конфигурацию и uploads
        shell: bash
        run: |
          set -euo pipefail
          backup_root="$RUNNER_TEMP/churchcms-backups"
          backup_id="$(cat "$RUNNER_TEMP/backup-id")"
          php bin/backup.php restore-files "$backup_id" --confirm="$backup_id" --path="$backup_root"

      - name: Проверить восстановленные файлы
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/config-local.sha256"
          sha256sum -c "$RUNNER_TEMP/upload-smoke.sha256"
          test ! -e storage/uploads/after-backup.txt
          test -z "$(find config storage -maxdepth 1 \
            \( -name '.restore-*' -o -name '.rollback-*' \) -print -quit)"
          php -r '
          $config = require "config/local.php";
          if (
              !is_array($config)
              || ($config["installation"]["completed"] ?? null) !== true
              || ($config["database"]["database"] ?? null) !== "churchcms"
          ) {
              fwrite(STDERR, "Восстановленная локальная конфигурация некорректна.\n");
              exit(1);
          }
          echo "Файловое восстановление проверено\n";
          '
