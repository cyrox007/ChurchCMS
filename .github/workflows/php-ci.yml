name: PHP 8.3 CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, pdo, pdo_pgsql
          coverage: none

      - name: Show PHP version
        run: php -v

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './legacy/*' -print0)

      - name: Bootstrap runtime
        run: php -r "require 'core.php'; echo 'ChurchCMS bootstrap OK', PHP_EOL;"

      - name: Validate migrations
        run: php bin/migrate.php validate

      - name: Smoke installation healthcheck
        shell: bash
        run: |
          php -r '
          require "core.php";
          $health = (new \\ChurchCMS\\Core\\InstallationHealthCheck(
              \\ChurchCMS\\Core\\DatabaseManager::getInstance(),
              CHURCHCMS_ROOT,
          ))->check();
          if (
              ($health["ready"] ?? null) !== false
              || ($health["checks"]["installation"] ?? null) !== false
              || ($health["checks"]["database"] ?? null) !== false
              || ($health["checks"]["migrations"] ?? null) !== true
          ) {
              fwrite(STDERR, "Unexpected fresh-checkout health state.\n");
              exit(1);
          }
          echo "Installation healthcheck smoke OK\n";
          '

      - name: Validate themes
        run: php bin/theme-check.php
